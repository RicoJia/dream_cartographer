version: '3.8'

services:
  halo:
    build:
      context: .
      dockerfile: Dockerfile_halo
      args:
        USER_ID: ${USER_ID}
        GROUP_ID: ${GROUP_ID}
        USER_NAME: ${USER_NAME}
    environment:
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/root/.Xauthority
    volumes:
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - $HOME/.Xauthority:/root/.Xauthority
      - ~/.ssh:/root/.ssh
      - /ccache:/ccache
    network_mode: "host"
    privileged: true
    dns:
      - 8.8.8.8
      - 8.8.4.4
    tty: true
    stdin_open: true
    user: "${USER_ID}:${GROUP_ID}"
    command: bash